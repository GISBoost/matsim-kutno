# Parametry sieci F2. Prędkości: decyzja D13. Jednostka: km/h.
# Kolejność: tag OSM maxspeed > domyślne wg limitów ustawowych (Prawo o ruchu drogowym, art. 20) > ...
# freespeed linku = prędkość dozwolona x factor.
# ZAŁOŻENIE: factor 0.8 obniża prędkość o 20% za skrzyżowania, zakręty i nawierzchnię (praktyka VSP, wartość arbitralna, do weryfikacji).
factor=0.8
# D23 (2026-10-21): współczynnik per grupa dróg (miasto = towns.wkt). Wartości z dopasowania do TomTom historic na zestawie analizy
# (reports/etap2/g5_predkosci_d23/krok2_dopasowanie.md), zaokrąglone decyzją użytkownika. Grupa bez wpisu (np. "inne") dostaje factor=0.8.
# A motorway; B trunk/primary/secondary poza miastem; C tertiary/unclassified poza miastem; D residential/living_street poza miastem;
# E trunk/primary/secondary/tertiary w mieście; F residential/unclassified/living_street w mieście.
factor.A=0.95
factor.B=1.00
factor.C=0.60
factor.D=0.70
factor.E=0.85
factor.F=0.55
# Bez tagu, link w mieście (gm. miejska / miasto gm. miejsko-wiejskiej z BREC): obszar zabudowany.
urban=50
# Bez tagu, poza miastem. ZAŁOŻENIE: wsie z obszarem zabudowanym traktujemy jak drogi zamiejskie (OSM nie ma granic obszarów zabudowanych).
rural=90
motorway=140
# trunk w PL to zwykle droga ekspresowa lub GP; ustawowo 100 (jednojezdniowa ekspresowa) do 120. ZAŁOŻENIE: 100.
trunk=100
# ZAŁOŻENIE: residential to ulice w obszarze zabudowanym, także na wsi.
residential=50
# strefa zamieszkania
living_street=20
# wartości tagu maxspeed w formie PL:*
PL\:urban=50
PL\:rural=90
PL\:motorway=140
PL\:expressway=120
PL\:zone30=30
PL\:living_street=20

# Zawrotki na granicy obszaru (F2, poprawka A1). Przycięcie sieci zostawia ślepe końce dróg jednokierunkowych
# (jezdnie autostrady), które NetworkCleaner usuwa aż do najbliższego węzła. Łączymy każdy węzeł-ujście
# (tylko wjazdy) z najbliższym węzłem-źródłem (tylko wyjazdy) w promieniu boundary_turnaround_max_m.
# Linki dostają type=boundary_turnaround. ZAŁOŻENIE: 300 m wystarcza, żeby połączyć dwie jezdnie tej samej drogi.
boundary_turnaround_max_m=300
boundary_turnaround_speed=30
boundary_turnaround_capacity=5000
# strefa granicy: zawrotki tylko dla węzłów w pasie boundary_zone_m od krawędzi obszaru sieci (lub poza nim)
boundary_zone_m=1000
