# Prędkości sieci F2 (decyzja D13). Jednostka: km/h.
# Kolejność: tag OSM maxspeed > domyślne wg limitów ustawowych (Prawo o ruchu drogowym, art. 20) > ...
# freespeed linku = prędkość dozwolona x factor.
# ZAŁOŻENIE: factor 0.8 obniża prędkość o 20% za skrzyżowania, zakręty i nawierzchnię (praktyka VSP, wartość arbitralna, do weryfikacji).
factor=0.8
# Bez tagu, link w mieście (gm. miejska / miasto gm. miejsko-wiejskiej z BREC): obszar zabudowany.
urban=50
# Bez tagu, poza miastem. ZAŁOŻENIE: wsie z obszarem zabudowanym traktujemy jak drogi zamiejskie (OSM nie ma granic obszarów zabudowanych).
rural=90
motorway=140
# trunk w PL to zwykle droga ekspresowa lub GP; ustawowo 100 (jednojezdniowa ekspresowa) do 120. ZAŁOŻENIE: 100.
trunk=100
# ZAŁOŻENIE: residential to ulice w obszarze zabudowanym, także na wsi.
residential=50
# strefa zamieszkania
living_street=20
# wartości tagu maxspeed w formie PL:*
PL\:urban=50
PL\:rural=90
PL\:motorway=140
PL\:expressway=120
PL\:zone30=30
PL\:living_street=20
