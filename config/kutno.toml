# Parametry pipeline'u Kutno. Każda wartość ma źródło albo jest jawnym ZAŁOŻENIEM.

[area]
teryt_gmina = "1002011"     # gm. miejska Kutno (FACT_CHECK #7)
teryt_powiat = "1002"       # powiat kutnowski, zasięg sieci (D9)
# ZAŁOŻENIE: bufor sieci poza granicą powiatu. Zatrzymuje drogi wjazdowe aż do
# pierwszych węzłów za granicą, żeby przyjeżdżający spoza powiatu mieli gdzie
# wjechać (D9). Wartość do weryfikacji w raporcie F2.
network_buffer_m = 3000

[demand]
# D17/B: pracujący mieszkańcy gm. Kutno z rejestrów ZUS/KRUS, BDL P4507 „ogółem” 2024, zmienna 1735394 (docs/ZRODLA.md).
employed_residents_reg = 17255

[plans]
seed = 4711
sample = 0.1                # D8: 10% -> potem 1.0
variant = "reg"             # D17/B: "reg" (rejestr P4507); D5: "base" albo "low" (kolumny work_in_kutno_* z F3)
# D17/C: 0 = bez skalowania (B); 17486 = suma miejsc pracy w Kutnie (mieszkańcy + przyjeżdżający) jak BDL P4508 2024,
# zmienna 1735396. Nadpisanie: plans.py <out> <sample> jobs_total=17486.
jobs_total = 0
# D19/K1-1, ZAŁOŻENIE: popyt car = pracujący × udział auta dom–praca × obecność (nie praca z domu). Skala popytu, nie wybór trybu.
# car_share: środek przedziału 61–67% dom–praca (Bochnia 2016, Radom 2022; docs/research/G4_tryby.md). Warianty: 0.61 / 0.67.
# work_from_home: łódzkie, praca wyłącznie z domu 7,3% (GUS Mobilność 2024, tabl. 1). 1.0 / 0.0 = bez skalowania (stan do D18).
car_share = 0.64
work_from_home = 0.073
# D19/K2-2: ruch tła (pojazdy lekkie), macierz O-D z pipeline/background_od.py (W2: τ = 30 min, waga wjazdu = capacity;
# R3: incydencja ułamkowa, bez liczników lokalnych 10045/91892/91119). "" = bez tła (stan do R1). R2: background_od_r1_w2_cap.csv.
background_od = "scenarios/kutno/demand/background_od_r93_lcv_gpr.csv"  # D32: baza R9.3 (R9.1: background_od_r91_lcv_gpr.csv) (R9: background_od_r9_lcv_gpr.csv; R7b: background_od_r7b_lcv_gpr.csv; R6: background_od_r6b_lcv_gpr.csv; R6a, krok 4 bez D1/D2: background_od_r6_lcv_gpr.csv; R4: background_od_r4_lcv_cap.csv; R3: background_od_r1_w2_frac_droplocal_cap.csv)
# D19/K3-2: godzina startu tła = profil dnia roboczego, pojazdy lekkie, SCPR 14005 Lisica 2025 (pipeline/digitize_lisica.py)
background_profile = "config/hourly_profile_lisica2025.csv"
# D20 (P1): tło lekkie z dostawczymi (cls=lcv) i ciężkie (cls=heavy) z pipeline/background_od.py; "" = bez ciężkich (stan R3).
# R4: background_od = "scenarios/kutno/demand/background_od_r4_lcv_cap.csv", heavy_od = "scenarios/kutno/demand/background_od_r4_heavy_cap.csv".
heavy_od = "scenarios/kutno/demand/background_od_r93_heavy_gpr.csv"  # D32: baza R9.3 (R9.1: background_od_r91_heavy_gpr.csv) (R9: background_od_r9_heavy_gpr.csv; R7b: background_od_r7b_heavy_gpr.csv; R6: background_od_r6b_heavy_gpr.csv; R6a: background_od_r6_heavy_gpr.csv; R4: background_od_r4_heavy_cap.csv); "" = bez ciężkich
# D20: pce typu pojazdu ciężkiego, WR-D-13-01 tab. 4.3.1 (zamiejski z przyczepą = miejski bez przyczepy). Wrażliwość: 3.0.
heavy_pce = 2.5
# Audyt G5/D9, ZAŁOŻENIE (D21, krok 4): końce ciężkich w gminach powiatu = budynki pracy (work_any w plans.py: typy work_buildings,
# amenity/shop/office, building=yes w landuse work_landuse), wagą powierzchni; tak samo punkty estymacji i waga a priori gminy
# w background_od.py cls=heavy. "all" = wszystkie budynki gminy (stan do R5: 19% końców w mieszkalnych i 31% w gospodarczych).
heavy_ends = "work"
# D10: godzina wyjazdu z domu = rozkład „dom - praca” z GBR Gdańsk 2022, Raport 3a, Rys. 46 (godzinowy,
# punkty krzywej wektorowej odczytane przez pipeline/digitize_gbr.py, data/manifest.csv). Udziały normalizowane do 100%.
# ZAŁOŻENIE: jednostajnie wewnątrz przedziału. Gdańsk (metropolia) != Kutno: przeniesienie rozkładu to też ZAŁOŻENIE.
departure_profile = "config/departure_home_work_gbr2022.csv"
work_max_dur = "08:00:00"   # GUS BCL 2013: 8 h 11 min średnio dla najemnych; zaokrąglone ZAŁOŻENIE

# ZAŁOŻENIE (D11, D9): budynki mieszkalne = te typy OSM + building=yes wewnątrz landuse=residential.
residential_buildings = ["house", "detached", "apartments", "residential", "semidetached_house", "terrace", "bungalow", "farm", "dormitory"]
# D28 (G3): źródło domów. "osm" = stan R7b/D11 (powyżej); "bdot" = BDOT10k OT_BUBD_A, waga = obrys × LICZBAKONDYGNACJI (brak = 1).
# Nadpisanie: plans.py <out> <sample> home_source=bdot. Od R9 (D28) baza = "bdot"; "osm" odtwarza R7b/R8.
home_source = "bdot"
home_bdot = "data/raw/g3/bdot10k/x/PL.PZGiK.340.BDOT10k.1002__OT_BUBD_A.gpkg"  # docs/ZRODLA.md, data/manifest.csv, wersja 2025-12-09
# ZAŁOŻENIE (D28): domem jest budynek eksploatowany o tych funkcjach przeważających. Odrzucone: dom letniskowy, parafialny, opieki
# społecznej, dziecka, internat/bursa, placówka opiekuńczo-wychowawcza, leśniczówka, klasztor, koszary i funkcje niemieszkalne.
home_bdot_functions = ["budynek jednorodzinny", "budynek wielorodzinny"]
# ZAŁOŻENIE (D28): obwód bez budynku-kandydata (punkt reprezentatywny poza obwodem) bierze najbliższy dom, jeśli jest bliżej niż tyle m.
home_nearest_max_m = 100
# ZAŁOŻENIE (D7): budynki pracy = te typy OSM + każdy budynek z tagiem amenity/shop/office
# + building=yes wewnątrz landuse industrial/commercial/retail. Tylko w gminie Kutno.
work_buildings = ["retail", "industrial", "warehouse", "office", "commercial", "school", "hospital", "public", "civic",
                  "government", "kindergarten", "university", "college", "supermarket", "service", "fire_station",
                  "train_station", "transportation", "manufacture", "factory", "hotel"]
work_landuse = ["industrial", "commercial", "retail"]
# D29 (R9.1): kierunek linku przypięcia aktywności. "route" = najbliższy link i jego odwrotny, wybór po trasie swobodnej bez zawrotki
# na początku i końcu trasy; "nearest" = najbliższy link (R9 i wcześniej). Nadpisanie: plans.py <out> <sample> snap_mode=route.
snap_mode = "route"
# D30 (krok 3 etapu 3): atrybuty osób (age, sex, license, carAvail) z pipeline/attributes.py; "off" odtwarza plany R9.1 bajt w bajt.
# licence_denominator: mianownik udziału praw jazdy CEPiK 2019 ("nsp2021" baza, "eurostat2019" wariant); car_avail_mode: "cars_per_licence"
# (ZAŁOŻENIE: always z p = auta/posiadacze prawa jazdy, łódzkie GUS 2024) albo "all_licence"; attr_seed: osobny generator losowy.
attributes = "on"
# D31 (krok 4A): rozdzielenie aktywności pracy na przyjazd i odjazd (osobne linki, noga walk 0 m); "off" = baza R9.2 (decyzja użytkownika), "on" = wariant (zawrotki 12,4% -> 1,1% podróży, ruch bez zmian ponad rozrzut).
work_split = "off"
# D32 (krok 4C): zakupy i usługi mieszkańców jako osobne wyjścia home -> shop|service -> home (kierowca, auto) z pipeline/errands.py;
# "off" odtwarza R9.2 bajt w bajt. Liczba wyjść = stawka GUS Mobilność 2024 (łódzkie, tabl. 10: dom-zakupy w CH, dom-inne zakupy, dom-usługi; osoby 6+
# z tabl. 4) x populacja Kutna 6+ x errand_car_share x próbka.
errands = "on"
errand_seed = 32
# ZAŁOŻENIE: udział jazd autem jako kierowca = 53,2% (Radom GOFR 2022, podróże fakultatywne, ze wszystkimi pasażerami) x 0,797 (kierowcy wśród jazd
# autem, GUS łódzkie 47,9/60,1). Warianty: 0,304 (Gdańsk dom-inne 38,2% x 0,797) i 0,479 (GUS wszystkie cele, kierowca).
errand_car_share = 0.424
errand_gus_pop6 = 2146153
errand_gus_shop_cc = 102892
errand_gus_shop = 229380
errand_gus_service = 25702
errand_dur = "00:57:00"   # ZAŁOŻENIE: GUS Budżet czasu 2023, zakupy i korzystanie z usług 0.57 (h.mm) na wykonującego (suma z dnia), bez dojazdu; dla jednej wizyty kierunek błędu niepewny
errand_participation = "config/errand_participation_bcl2023.csv"   # GUS Budżet czasu 2023, tabl. 2: odsetek osób robiących zakupy i usługi wg wieku (waga wyboru)
errand_departure = "config/departure_home_inne_gbr2022.csv"        # GBR Gdańsk 2022 rys. 46 „dom - inne” (ZAŁOŻENIE: Gdańsk != Kutno), pipeline/digitize_gbr_inne.py
# D34 (wariant, inspekcja reports/etap3/g_zakupy/inspekcja_qgis/): cel zakupów "bdot" = funkcje BDOT, waga obrys (baza R9.3);
# "osm" = sklepy OSM (pipeline/osm_poi.py): c = supermarket|mall|department_store, s = pozostałe shop=*, także w budynkach mieszkalnych;
# ZAŁOŻENIE: waga = liczba sklepów w budynku (nie obrys), sklep przypisany do budynku BDOT do errand_poi_m. Usługi u bez zmian.
errand_dest = "bdot"
errand_shops = "scenarios/kutno/osm/shops.csv"
errand_poi_m = 15.0
attr_seed = 30
licence_denominator = "nsp2021"
# licence_m65: mężczyźni 65+ w CEPiK mają iloraz > 1 (rejestr z martwymi duszami): "m5564" = udział jak mężczyźni 55-64 (baza D30, ZAŁOŻENIE), "cap098" = górne ograniczenie 0,98.
licence_m65 = "m5564"
car_avail_mode = "cars_per_licence"
# ZAŁOŻENIE (D9): wjazd spoza powiatu = najbliższy (do centroidu gminy źródłowej) link tych klas
# zaczynający się w strefie granicy sieci (boundary_zone_m z config/network.properties) i skierowany do Kutna.
entry_road_types = ["motorway", "trunk", "primary", "secondary"]
entry_zone_m = 1000
# R3/E5: aktywności przypinane do najbliższego linku z pominięciem tych typów (inaczej MATSim przypina dom do jezdni A1).
# Wjazdy graniczne (D9) zachowują swój link.
snap_exclude_types = ["motorway", "motorway_link", "trunk", "trunk_link", "boundary_turnaround"]
# D16/A: przyjeżdżający spoza powiatu pojawiają się na wjeździe granicznym o godzinie z departure_profile
# (bez doliczania dojazdu z gminy; zastępuje R3/E1 z 72 km/h i krętością 1,3).
# D16/B, ZAŁOŻENIE (decyzja użytkownika 2026-10-17): gminy spoza powiatu z centroidem dalej niż max_border_km od najbliższego
# wjazdu są pomijane: codzienny dojazd autem z takiej odległości uznajemy za nierealny (relacje w macierzy GUS
# to raczej adres pracodawcy, zasady projektu gotchas). Warszawa (~89 km) zostaje; próg to parametr do wariantów.
max_border_km = 100
