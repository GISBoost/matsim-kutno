# Parametry pipeline'u Kutno. Każda wartość ma źródło albo jest jawnym ZAŁOŻENIEM.

[area]
teryt_gmina = "1002011"     # gm. miejska Kutno (FACT_CHECK #7)
teryt_powiat = "1002"       # powiat kutnowski, zasięg sieci (D9)
# ZAŁOŻENIE: bufor sieci poza granicą powiatu. Zatrzymuje drogi wjazdowe aż do
# pierwszych węzłów za granicą, żeby przyjeżdżający spoza powiatu mieli gdzie
# wjechać (D9). Wartość do weryfikacji w raporcie F2.
network_buffer_m = 3000

[plans]
seed = 4711
sample = 0.1                # D8: 10% -> potem 1.0
variant = "base"            # D5: "base" albo "low" (kolumny work_in_kutno_* z F3)
# ZAŁOŻENIE (D10): stałe godziny do czasu rozkładu ze źródła (R1: kandydat GBR 2022 Rys. 46, nieprzeniesiony).
home_end_time = "07:00:00"
work_max_dur = "08:00:00"   # GUS BCL 2013: 8 h 11 min średnio dla najemnych; zaokrąglone ZAŁOŻENIE

# ZAŁOŻENIE (D11, D9): budynki mieszkalne = te typy OSM + building=yes wewnątrz landuse=residential.
residential_buildings = ["house", "detached", "apartments", "residential", "semidetached_house", "terrace", "bungalow", "farm", "dormitory"]
# ZAŁOŻENIE (D7): budynki pracy = te typy OSM + każdy budynek z tagiem amenity/shop/office
# + building=yes wewnątrz landuse industrial/commercial/retail. Tylko w gminie Kutno.
work_buildings = ["retail", "industrial", "warehouse", "office", "commercial", "school", "hospital", "public", "civic",
                  "government", "kindergarten", "university", "college", "supermarket", "service", "fire_station",
                  "train_station", "transportation", "manufacture", "factory", "hotel"]
work_landuse = ["industrial", "commercial", "retail"]
# ZAŁOŻENIE (D9): wjazd spoza powiatu = najbliższy (do centroidu gminy źródłowej) link tych klas
# zaczynający się w strefie granicy sieci (boundary_zone_m z config/network.properties) i skierowany do Kutna.
entry_road_types = ["motorway", "trunk", "primary", "secondary"]
entry_zone_m = 1000
