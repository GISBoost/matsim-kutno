# Parametry pipeline'u Kutno. Każda wartość ma źródło albo jest jawnym ZAŁOŻENIEM.

[area]
teryt_gmina = "1002011"     # gm. miejska Kutno (FACT_CHECK #7)
teryt_powiat = "1002"       # powiat kutnowski, zasięg sieci (D9)
# ZAŁOŻENIE: bufor sieci poza granicą powiatu. Zatrzymuje drogi wjazdowe aż do
# pierwszych węzłów za granicą, żeby przyjeżdżający spoza powiatu mieli gdzie
# wjechać (D9). Wartość do weryfikacji w raporcie F2.
network_buffer_m = 3000

[demand]
# D17/B: pracujący mieszkańcy gm. Kutno z rejestrów ZUS/KRUS, BDL P4507 „ogółem” 2024, zmienna 1735394 (docs/ZRODLA.md).
employed_residents_reg = 17255

[plans]
seed = 4711
sample = 0.1                # D8: 10% -> potem 1.0
variant = "reg"             # D17/B: "reg" (rejestr P4507); D5: "base" albo "low" (kolumny work_in_kutno_* z F3)
# D17/C: 0 = bez skalowania (B); 17486 = suma miejsc pracy w Kutnie (mieszkańcy + przyjeżdżający) jak BDL P4508 2024,
# zmienna 1735396. Nadpisanie: plans.py <out> <sample> jobs_total=17486.
jobs_total = 0
# D19/K1-1, ZAŁOŻENIE: popyt car = pracujący × udział auta dom–praca × obecność (nie praca z domu). Skala popytu, nie wybór trybu.
# car_share: środek przedziału 61–67% dom–praca (Bochnia 2016, Radom 2022; docs/research/G4_tryby.md). Warianty: 0.61 / 0.67.
# work_from_home: łódzkie, praca wyłącznie z domu 7,3% (GUS Mobilność 2024, tabl. 1). 1.0 / 0.0 = bez skalowania (stan do D18).
car_share = 0.64
work_from_home = 0.073
# D19/K2-2: ruch tła (pojazdy lekkie), macierz O-D z pipeline/background_od.py (W2: τ = 30 min, waga wjazdu = capacity;
# R3: incydencja ułamkowa, bez liczników lokalnych 10045/91892/91119). "" = bez tła (stan do R1). R2: background_od_r1_w2_cap.csv.
background_od = "scenarios/kutno/demand/background_od_r1_w2_frac_droplocal_cap.csv"
# D19/K3-2: godzina startu tła = profil dnia roboczego, pojazdy lekkie, SCPR 14005 Lisica 2025 (pipeline/digitize_lisica.py)
background_profile = "config/hourly_profile_lisica2025.csv"
# D10: godzina wyjazdu z domu = rozkład „dom - praca” z GBR Gdańsk 2022, Raport 3a, Rys. 46 (godzinowy,
# punkty krzywej wektorowej odczytane przez pipeline/digitize_gbr.py, data/manifest.csv). Udziały normalizowane do 100%.
# ZAŁOŻENIE: jednostajnie wewnątrz przedziału. Gdańsk (metropolia) != Kutno: przeniesienie rozkładu to też ZAŁOŻENIE.
departure_profile = "config/departure_home_work_gbr2022.csv"
work_max_dur = "08:00:00"   # GUS BCL 2013: 8 h 11 min średnio dla najemnych; zaokrąglone ZAŁOŻENIE

# ZAŁOŻENIE (D11, D9): budynki mieszkalne = te typy OSM + building=yes wewnątrz landuse=residential.
residential_buildings = ["house", "detached", "apartments", "residential", "semidetached_house", "terrace", "bungalow", "farm", "dormitory"]
# ZAŁOŻENIE (D7): budynki pracy = te typy OSM + każdy budynek z tagiem amenity/shop/office
# + building=yes wewnątrz landuse industrial/commercial/retail. Tylko w gminie Kutno.
work_buildings = ["retail", "industrial", "warehouse", "office", "commercial", "school", "hospital", "public", "civic",
                  "government", "kindergarten", "university", "college", "supermarket", "service", "fire_station",
                  "train_station", "transportation", "manufacture", "factory", "hotel"]
work_landuse = ["industrial", "commercial", "retail"]
# ZAŁOŻENIE (D9): wjazd spoza powiatu = najbliższy (do centroidu gminy źródłowej) link tych klas
# zaczynający się w strefie granicy sieci (boundary_zone_m z config/network.properties) i skierowany do Kutna.
entry_road_types = ["motorway", "trunk", "primary", "secondary"]
entry_zone_m = 1000
# R3/E5: aktywności przypinane do najbliższego linku z pominięciem tych typów (inaczej MATSim przypina dom do jezdni A1).
# Wjazdy graniczne (D9) zachowują swój link.
snap_exclude_types = ["motorway", "motorway_link", "trunk", "trunk_link", "boundary_turnaround"]
# D16/A: przyjeżdżający spoza powiatu pojawiają się na wjeździe granicznym o godzinie z departure_profile
# (bez doliczania dojazdu z gminy; zastępuje R3/E1 z 72 km/h i krętością 1,3).
# D16/B, ZAŁOŻENIE (decyzja użytkownika 2026-10-17): gminy spoza powiatu z centroidem dalej niż max_border_km od najbliższego
# wjazdu są pomijane: codzienny dojazd autem z takiej odległości uznajemy za nierealny (relacje w macierzy GUS
# to raczej adres pracodawcy, CLAUDE.md gotchas). Warszawa (~89 km) zostaje; próg to parametr do wariantów.
max_border_km = 100
