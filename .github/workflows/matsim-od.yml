# Krok 0 etapu 3: estymacja O-D tła na GitHub Actions (zastępuje lokalne run_r1.sh + run_od.sh).
# 1) run: model pracujących bez tła i ciężkich (scenarios/kutno_od, plany plans_k1.xml.gz), 3 seedy MATSim, 25%, domyślnie 50 iteracji
# 2) estymacja: background_od.py cls=lcv|heavy x warianty p0 (seed domyślny), p1 (seed=1), p2 (seed=2), drop=10045,91892,91119, tau=30
# 3) kontrola: od_warnings.py dla każdego wariantu, porównanie z istniejącymi macierzami (input compare, np. r91)
# Wynik: artefakt od-macierze-<tag> (background_od_<tag>[_p1|_p2]_{lcv,heavy}_gpr.csv, k2_od_*, warn_*.json). Commit macierzy robi człowiek.
# Zmiana popytu = nowy plans_k1.xml.gz w scenarios/kutno_od/ (plans.py ... background_od= heavy_od=), nowy tag.
name: matsim-od
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag macierzy wyjściowych (background_od_<tag>_...)"
        default: "r91chk"
      compare:
        description: "Tag istniejących macierzy do porównania bajt w bajt (puste = bez porównania)"
        default: "r91"
      iterations:
        description: "Liczba iteracji (użytkownik 2026-10-23: maks. 50)"
        default: "50"
      threads:
        description: "Wątki (global + qsim)"
        default: "2"
env:
  SC: scenarios/kutno_od
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [4711, 1, 2]
    env:
      OUT: output/od_s${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build jar
        working-directory: matsim
        run: bash ./mvnw -B package -DskipTests
      - name: MATSim
        run: |
          mkdir -p output
          cp scenarios/kutno_r91/network.xml.gz $SC/network.xml.gz
          java -Xmx6g -jar matsim/matsim-example-project-0.0.1-SNAPSHOT.jar run \
            --config $SC/config.xml --output "$OUT" --iterations ${{ inputs.iterations }} \
            --config:global.randomSeed=${{ matrix.seed }} \
            --config:global.numberOfThreads=${{ inputs.threads }} --config:qsim.numberOfThreads=${{ inputs.threads }} \
            2>&1 | tee run.log
      - name: Kontrola eventów
        run: |
          python -m pip install uv
          uv sync --frozen
          mkdir -p pakiet
          uv run python pipeline/check_events.py "$OUT/output_events.xml.zst" > pakiet/check_events.json || true
          test -s "$OUT/output_links.csv.zst"
          cp "$OUT/output_config.xml" "$OUT/output_links.csv.zst" run.log pakiet/
      - uses: actions/upload-artifact@v4
        with:
          name: od-run-${{ matrix.seed }}
          path: pakiet
          retention-days: 14

  estymacja:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cls: [lcv, heavy]
        variant: [{ id: "", seed: "" }, { id: "_p1", seed: "seed=1" }, { id: "_p2", seed: "seed=2" }]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: od-run-*
          path: output/runs
      - name: Wejścia estymacji
        run: |
          python -m pip install uv
          uv sync --frozen
          mkdir -p scenarios/kutno/osm
          cp scenarios/kutno_r91/network.xml.gz scenarios/kutno/network.xml.gz
          cp $SC/features.gpkg scenarios/kutno/osm/features.gpkg
      - name: background_od.py
        run: |
          T=${{ inputs.tag }}${{ matrix.variant.id }}_${{ matrix.cls }}_gpr
          uv run python -W ignore pipeline/background_od.py 30 $T output/runs/od-run-4711 output/runs/od-run-1 output/runs/od-run-2 \
            cls=${{ matrix.cls }} drop=10045,91892,91119 ${{ matrix.variant.seed }} 2>&1 | tee od_$T.log
          test -s scenarios/kutno/demand/background_od_$T.csv
          mkdir -p pakiet
          cp scenarios/kutno/demand/background_od_$T.csv od_$T.log pakiet/
          cp reports/etap2/g5_kalibracja/k2_od_$T.* pakiet/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: od-${{ matrix.cls }}${{ matrix.variant.id }}
          path: pakiet
          retention-days: 14

  kontrola:
    needs: estymacja
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: od-[lh]*
          path: wynik
          merge-multiple: true
      - name: Ostrzeżenia i porównanie
        run: |
          python -m pip install uv
          uv sync --frozen
          mkdir -p scenarios/kutno/osm pakiet
          cp scenarios/kutno_r91/network.xml.gz scenarios/kutno/network.xml.gz
          cp $SC/features.gpkg scenarios/kutno/osm/features.gpkg
          T=${{ inputs.tag }}; RC=0
          for v in "" _p1 _p2; do
            uv run python -W ignore pipeline/od_warnings.py "wynik/warn_$T$v" lcv="wynik/background_od_$T${v}_lcv_gpr.csv" \
              heavy="wynik/background_od_$T${v}_heavy_gpr.csv" heavy_ends=work || RC=1
            for c in lcv heavy; do
              if [ -n "${{ inputs.compare }}" ]; then
                if cmp -s "wynik/background_od_$T${v}_${c}_gpr.csv" "scenarios/kutno/demand/background_od_${{ inputs.compare }}${v}_${c}_gpr.csv"; then
                  echo "IDENTYCZNA $v $c" | tee -a wynik/porownanie.txt
                else echo "RÓŻNA $v $c" | tee -a wynik/porownanie.txt; fi
              fi
            done
          done
          cp -r wynik/. pakiet/
          exit $RC
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: od-macierze-${{ inputs.tag }}
          path: pakiet
          retention-days: 30
