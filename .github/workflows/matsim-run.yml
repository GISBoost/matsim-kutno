# Run bazy R7b (Kutno, 25%) na GitHub Actions: iteracje x seed z listy. Tylko ręcznie (workflow_dispatch), niczego nie uruchamia samo.
# Wejścia: scenarios/kutno_r7b_25pct/ (sieć, plany, pojazdy, config; samodzielne). Wynik: artefakt per liczba iteracji + porównanie 100 vs 400 w jobie "porownanie".
# NIE TESTOWANE na GitHubie (stan: szkic z 2026-10-21). Lokalnie sprawdzone: ten sam jar i config, kroki analizy z tego pliku.
name: matsim-run
on:
  workflow_dispatch:
    inputs:
      iterations_list:
        description: "Lista liczby iteracji (JSON), każda to osobny job"
        default: "[100, 400]"
      seed:
        description: "randomSeed MATSim"
        default: "4711"
      threads:
        description: "Wątki (global + qsim). R6/R7b liczone na 2; 4 i 8 dają ten sam wynik, 1 inny"
        default: "2"
jobs:
  run:
    runs-on: ubuntu-latest   # publiczne repo: 4 vCPU, 16 GB RAM, ok. 14 GB dysku, limit joba 6 h
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        iterations: ${{ fromJson(inputs.iterations_list) }}
    env:
      OUT: output/gha_${{ matrix.iterations }}it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"      # MATSim 2026.0 wymaga Javy 25
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build jar
        working-directory: matsim
        run: bash ./mvnw -B package -DskipTests
      - name: MATSim
        run: |
          mkdir -p output
          java -Xmx6g -jar matsim/matsim-example-project-0.0.1-SNAPSHOT.jar run \
            --config scenarios/kutno_r7b_25pct/config.xml --output "$OUT" \
            --iterations ${{ matrix.iterations }} \
            --config:global.randomSeed=${{ inputs.seed }} \
            --config:global.numberOfThreads=${{ inputs.threads }} --config:qsim.numberOfThreads=${{ inputs.threads }} \
            2>&1 | tee run.log
      - name: Analiza (te same skrypty co lokalnie)
        run: |
          python -m pip install uv
          uv sync --frozen
          mkdir -p "$OUT/analiza"
          EV=$(ls "$OUT"/output_events.xml.zst)
          uv run python pipeline/check_events.py "$EV" > "$OUT/analiza/check_events.json" || true
          uv run python -W ignore pipeline/convergence.py "$OUT/analiza/convergence" "$OUT" || true
          for c in lcv heavy; do uv run python -W ignore pipeline/g5_baseline.py "$OUT/analiza/gpr_$c" "$OUT" cls=$c || true; done
          uv run python -W ignore pipeline/link_delay.py "$OUT" "$OUT/analiza/delay" || true
          uv run python -W ignore pipeline/queues.py "$OUT" "$OUT/analiza/queues" || true
      - name: Pakiet wyników (bez dużych plików zdarzeń z iteracji pośrednich)
        run: |
          mkdir -p pakiet
          cp -r "$OUT/analiza" pakiet/
          cp run.log pakiet/ || true
          for f in logfile.log scorestats.csv stopwatch.csv modestats.csv output_config.xml output_legs.csv.zst output_trips.csv.zst \
                   output_links.csv.zst output_events.xml.zst; do cp "$OUT/$f" pakiet/ 2>/dev/null || true; done
          mkdir -p pakiet/linkstats; cp "$OUT"/ITERS/it.*/*.linkstats.txt.gz pakiet/linkstats/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: kutno-r7b-${{ matrix.iterations }}it
          path: pakiet
          retention-days: 30
  porownanie:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: wyniki
      - name: "Porównanie (compare_runs.py, pierwszy i ostatni element listy)"
        run: |
          python -m pip install uv && uv sync --frozen
          LIST=$(ls wyniki | sort -t- -k3 -n)
          A=$(echo "$LIST" | head -1); B=$(echo "$LIST" | tail -1)
          mkdir -p cmp
          for d in "$A" "$B"; do mkdir -p "cmp/$d"; cp wyniki/$d/*.zst wyniki/$d/*.csv wyniki/$d/*.xml cmp/$d/ 2>/dev/null || true; done
          uv run python pipeline/compare_runs.py cmp/porownanie.png "$A=cmp/$A" "$B=cmp/$B" || true
      - uses: actions/upload-artifact@v4
        with:
          name: porownanie
          path: cmp/porownanie*
